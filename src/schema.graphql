type Query {
  # User queries
  me: User
  user(id: Int!): User
  users: [User!]!

  # Hobby queries
  hobby(id: Int!): Hobby
  hobbies: [Hobby!]!
}

type Mutation {
  # Authentication mutations
  registerUser(input: CreateUserInput!): AuthPayload!
  loginUser(input: LoginInput!): AuthPayload!
  loginWithGoogle(token: String!): AuthPayload!

  # User mutations
  updateUser(id: Int!, input: UpdateUserInput!): User!
  deleteUser(id: Int!): Boolean!

  # Hobby mutations
  createHobby(name: String!): Hobby!

  # User-Hobby relationship
  addUserHobby(userId: Int!, hobbyId: Int!, skillLevel: String): UserHobby!
}

type User {
  user_id: Int!
  google_id: String
  email: String!
  firstname: String
  lastname: String
  age: Int
  gender: String
  location: String
  profile_image_url: String
  profile_description: String
  created_at: String!

  # Relationships
  hobbies: [UserHobby!]!
  saved_users: [SavedUser!]!
  conversations_as_user1: [Conversation!]!
  conversations_as_user2: [Conversation!]!
}

type Hobby {
  hobby_id: Int!
  hobby_name: String!
  users: [UserHobby!]!
}

type UserHobby {
  id: Int!
  user_id: Int!
  hobby_id: Int!
  skill_level: String
  user: User!
  hobby: Hobby!
}

type SavedUser {
  id: Int!
  user_id: Int!
  saved_user_id: Int!
  created_at: String!
  user: User!
  saved_user: User!
}

type Conversation {
  conversation_id: Int!
  user1_id: Int!
  user2_id: Int!
  created_at: String!
  last_message_at: String
  user1: User!
  user2: User!
  messages: [ConversationMessage!]!
}

type ConversationMessage {
  message_id: Int!
  conversation_id: Int!
  sender_id: Int!
  content: String!
  created_at: String!
  read_at: String
  conversation: Conversation!
  sender: User!
}

# Authentication types
input CreateUserInput {
  email: String!
  password: String!
  firstname: String
  lastname: String
}

input LoginInput {
  email: String!
  password: String!
}

type AuthPayload {
  token: String!
  user: User!
}

# Input types for mutations
input UpdateUserInput {
  email: String
  firstname: String
  lastname: String
  age: Int
  gender: String
  location: String
  profile_description: String
}
