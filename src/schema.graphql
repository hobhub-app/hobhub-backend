scalar DateTime

type Query {
  # User queries
  me: User
  user(id: Int!): User
  users: [User!]!

  # Hobby queries
  hobby(id: Int!): Hobby
  hobbies: [Hobby!]!

  # Conversation queries
  myConversations: [Conversation!]!
  conversationMessages(conversationId: Int!): [ConversationMessage!]!
}

type Mutation {
  # Authentication mutations
  registerUser(input: CreateUserInput!): AuthPayload!
  loginUser(input: LoginInput!): AuthPayload!
  loginWithGoogle(token: String!): AuthPayload!

  # User mutations
  updateUser(id: Int!, input: UpdateUserInput!): User!
  deleteUser(id: Int!): Boolean!

  # Hobby mutations
  createHobby(name: String!): Hobby!

  # User-Hobby relationship
  addUserHobby(userId: Int!, hobbyId: Int!, skillLevel: String): UserHobby!

  # Conversation mutations
  sendMessage(receiverId: Int!, content: String!): ConversationMessage!
}

type User {
  id: Int!
  googleId: String
  email: String!
  firstname: String
  lastname: String
  age: Int
  gender: String
  location: String
  profileImageUrl: String
  profileDescription: String
  createdAt: DateTime!

  # Relationships
  hobbies: [UserHobby!]!
  savedUsers: [SavedUser!]!
  conversationsAsUser1: [Conversation!]!
  conversationsAsUser2: [Conversation!]!
}

type Hobby {
  id: Int!
  name: String!
  users: [UserHobby!]!
}

type UserHobby {
  id: Int!
  userId: Int!
  hobbyId: Int!
  skillLevel: String
  user: User!
  hobby: Hobby!
}

type SavedUser {
  id: Int!
  userId: Int!
  savedUserId: Int!
  createdAt: DateTime!
  user: User!
  savedUser: User!
}

# Conversation and messages
type Conversation {
  id: Int!
  user1Id: Int!
  user2Id: Int!
  createdAt: DateTime!
  lastMessageAt: DateTime!
  lastMessageContent: String!
  user1: User!
  user2: User!
  messages: [ConversationMessage!]!
}

type ConversationMessage {
  id: Int!
  conversationId: Int!
  senderId: Int!
  content: String!
  createdAt: DateTime!
  readAt: DateTime
  conversation: Conversation!
  sender: User!
}

# Authentication types
input CreateUserInput {
  email: String!
  password: String!
  firstname: String
  lastname: String
}

input LoginInput {
  email: String!
  password: String!
}

type AuthPayload {
  token: String!
  user: User!
}

# Input types for mutations
input UpdateUserInput {
  email: String
  firstname: String
  lastname: String
  age: Int
  gender: String
  location: String
  profileDescription: String
}
